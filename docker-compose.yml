services:
  postgres:
    image: postgres:16-alpine
    container_name: kontrola_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontrola
      POSTGRES_PASSWORD: kontrola_dev
      POSTGRES_DB: kontrola
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # Host port 5433 (umesto 5432) da ne sudara sa postojećim Postgres-om.
      # Unutar kontejnera i dalje sluša na 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontrola -d kontrola"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kontrola_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      # Host port 6380 (umesto 6379) iz istog razloga kao Postgres.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: kontrola_postgres_data
  redis_data:
    name: kontrola_redis_data
